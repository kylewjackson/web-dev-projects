[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bb-live-feeds"
version = "0.1.0"
description = "Archive and analyze complete Reddit discussion threads."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kyle" }]
dependencies = [
    "fastapi>=0.115,<1",
    "praw>=7.8,<8",
    "pydantic>=2.10,<3",
    "rich>=13.9,<15",
]

[project.scripts]
reddit-archiver = "reddit_archiver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reddit_archiver"]
